name: Backport SuSFS v2.0.0

on:
  workflow_dispatch:

jobs:
  backport:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout target kernel repo
      - name: Checkout target kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # perlu semua riwayat untuk cherry-pick

      # 2️⃣ Setup Git identity
      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Tambahkan source remote (repo SuSFS)
      - name: Add source remote (kylieeXD surya)
        run: |
          git remote add susfs-src https://github.com/kerjarodipp-glitch/kernel_xiaomi_vayu
          git fetch susfs-src

      # 4️⃣ Buat branch backport baru
      - name: Create backport branch
        run: |
          git checkout -b susfs-backport

      # 5️⃣ Cherry-pick semua commit SuSFS
      - name: Try to cherry-pick SuSFS commits
        id: cherry
        run: |
          set -e
          COMMITS=(
            b9162dd755798b362528e8971191c1a9bd6c2e65
            4b56688b152c9b7686fa7ab7fffe57e2f0699b71
            1bc8fd282aaa1c05a927fd1510731483714765f2
            837d371f0db25dcf42530243e16e504bd862aee3
            b2c763c07c0695594017fbbb396941af1a88e74b
            2ce244c4076dd741f49443ecef5cdb7b71980751
            fb78ceea3a197196d086a6498d9dfd2798da4b67
            7cf84c22e4b290a434236adf66c1ffee901d85b8
            914b4a78e0ad8f6a61455ed5fabd0ad65ce67ad6
            a0e76dff847aee42dfa5ec8e5449243d49c97a30
            091afa001df6803f47a85d1de70d675c26c5ddfd
            39c97dea31c84ce9fe4cff5587eca147c03a5ef4
          )
          
          for COMMIT in "${COMMITS[@]}"; do
            git cherry-pick $COMMIT || echo "conflict" >> .conflict
          done

      # 6️⃣ Tangani konflik jika ada
      - name: Handle conflicts if any
        if: ${{ hashFiles('.conflict') != '' }}
        run: |
          echo "::warning::Cherry-pick caused conflicts, keeping partial patch"
          git status
          git add .
          git commit -m "Conflict Fix Needed"

      # 7️⃣ Push branch backport ke repo lain menggunakan PAT
      - name: Push backport branch to external repo
        env:
          GITHUB_PAT: ${{ secrets.MY_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_PAT}@github.com/kerjarodipp-glitch/kernel_xiaomi_vayu.git
          git push origin susfs-backport --force

      # 8️⃣ Ringkasan hasil
      - name: Show summary
        run: |
          echo "✅ Backport finished. If there were conflicts, please resolve manually in the repo."
