name: Cherry-pick Commits to Default Branch

on:
  workflow_dispatch:

jobs:
  cherry-pick:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Git identity
      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      # 3️⃣ Checkout default branch
      - name: Checkout default branch
        run: |
          default_branch=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
          echo "Default branch is $default_branch"
          git checkout $default_branch

      # 4️⃣ Cherry-pick commits
      - name: Cherry-pick commits
        run: |
          set -e
          commits=(
            b9162dd755798b362528e8971191c1a9bd6c2e65
            4b56688b152c9b7686fa7ab7fffe57e2f0699b71
            1bc8fd282aaa1c05a927fd1510731483714765f2
            837d371f0db25dcf42530243e16e504bd862aee3
            b2c763c07c0695594017fbbb396941af1a88e74b
            2ce244c4076dd741f49443ecef5cdb7b71980751
            fb78ceea3a197196d086a6498d9dfd2798da4b67
            7cf84c22e4b290a434236adf66c1ffee901d85b8
            914b4a78e0ad8f6a61455ed5fabd0ad65ce67ad6
            a0e76dff847aee42dfa5ec8e5449243d49c97a30
            091afa001df6803f47a85d1de70d675c26c5ddfd
            39c97dea31c84ce9fe4cff5587eca147c03a5ef4
          )

          for commit in "${commits[@]}"; do
            echo "Cherry-picking $commit..."
            git cherry-pick $commit || { echo "Conflict detected at $commit. Resolve manually."; exit 1; }
          done

      # 5️⃣ Push changes ke default branch
      - name: Push to default branch
        run: |
          git push origin HEAD
